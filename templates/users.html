{% extends 'base.html' %}
{% block content %}
<section class="panel">
  <h1>Usuarios y perfiles</h1>
  <p class="muted">El correo se utiliza para iniciar sesión. Complete los perfiles existentes para mostrar nombres en las asignaciones.</p>
  <div class="scroll">
    <table>
      <thead><tr><th>Nombre</th><th>Apellido</th><th>Correo</th><th>Teléfono</th><th>Rol</th><th></th></tr></thead>
      <tbody>
      {% for u in users %}
        <tr>
          <td><input form="profile-{{u.id}}" name="first_name" value="{{u.first_name}}" maxlength="100" placeholder="Nombre" required></td>
          <td><input form="profile-{{u.id}}" name="last_name" value="{{u.last_name}}" maxlength="100" placeholder="Apellido" required></td>
          <td><input form="profile-{{u.id}}" name="email" type="email" value="{{u.email or u.username}}" maxlength="254" placeholder="correo@empresa.cl" required></td>
          <td><input form="profile-{{u.id}}" name="phone" type="tel" value="{{u.phone}}" maxlength="30" placeholder="+56 9 1234 5678" required></td>
          <td><select form="profile-{{u.id}}" name="role" aria-label="Rol de {{u.first_name or u.username}}"><option value="usuario" {{'selected' if u.role=='usuario' else ''}}>Usuario</option><option value="cotizador" {{'selected' if u.role=='cotizador' else ''}}>Cotizador</option><option value="admin" {{'selected' if u.role=='admin' else ''}}>Administrador</option></select></td>
          <td><form id="profile-{{u.id}}" method="post" action="{{url_for('admin.update_user_profile',user_id=u.id)}}"><input type="hidden" name="csrf" value="{{csrf}}"><button>Guardar perfil</button></form></td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</section>
<section class="panel">
  <h2>Crear usuario</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{csrf}}">
    <div class="grid">
      <div><label>Nombre</label><input name="first_name" maxlength="100" required></div>
      <div><label>Apellido</label><input name="last_name" maxlength="100" required></div>
      <div><label>Correo</label><input name="email" type="email" maxlength="254" autocomplete="username" required></div>
      <div><label>Número de teléfono</label><input name="phone" type="tel" maxlength="30" placeholder="+56 9 1234 5678" required></div>
      <div><label>Contraseña (mín. 12 caracteres)</label><input name="password" type="password" minlength="12" autocomplete="new-password" required></div>
      <div><label>Rol</label><select name="role"><option value="usuario">Usuario</option><option value="cotizador">Cotizador</option><option value="admin">Administrador</option></select></div>
    </div>
    <p><button>Crear usuario</button></p>
  </form>
</section>
{% endblock %}
