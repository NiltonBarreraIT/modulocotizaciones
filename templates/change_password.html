{% extends 'base.html' %}
{% block content %}
<section class="panel password-change-panel">
  <span class="pill lock">Acción requerida</span>
  <h1>Cree una nueva contraseña</h1>
  <p class="muted">Está usando una contraseña temporal. Para proteger su cuenta, debe reemplazarla antes de continuar.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{csrf}}">
    <p><label for="password">Nueva contraseña</label><input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required><span class="field-help muted">Use al menos 12 caracteres y no repita la contraseña temporal.</span></p>
    <p><label for="password-confirmation">Confirmar nueva contraseña</label><input id="password-confirmation" name="password_confirmation" type="password" minlength="12" autocomplete="new-password" required></p>
    <button>Guardar y continuar</button>
  </form>
</section>
{% endblock %}
